; ---------------------------------------------------------------------------
; Crypto Vault — Laravel Reverb (WebSocket server)
; Copy to /etc/supervisor/conf.d/crypto-vault-reverb.conf
;
; Nginx proxies wss://your-domain/app -> 127.0.0.1:8080 (see deploy/nginx.conf).
; ---------------------------------------------------------------------------
[program:crypto-vault-reverb]
process_name=%(program_name)s
command=php /var/www/crypto-vault/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/crypto-vault
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/crypto-vault-reverb.log
stopwaitsecs=30
stopasgroup=true
killasgroup=true
