; ---------------------------------------------------------------------------
; Crypto Vault — plain queue workers (ALTERNATIVE to Horizon)
;
; Use this file ONLY if you deliberately skip Horizon. Enable either
; supervisor-horizon.conf OR this file — never both.
;
; NOTE: `artisan horizon` is the recommended setup because it provides
; metrics, balanced autoscaling and queue monitoring out of the box.
; ---------------------------------------------------------------------------
[program:crypto-vault-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/crypto-vault/artisan queue:work redis --queue=deposits,withdrawals,default --sleep=1 --tries=3 --max-time=3600 --timeout=180
directory=/var/www/crypto-vault
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/crypto-vault-worker.log
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
