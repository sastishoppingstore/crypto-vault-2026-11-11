# ---------------------------------------------------------------------------
# Crypto Vault — nginx site config
# Copy to /etc/nginx/sites-available/crypto-vault and symlink into sites-enabled.
# Replace:
#   vault.example.com   -> your domain
#   /var/www/crypto-vault -> your project path
# Then: certbot --nginx -d vault.example.com
# ---------------------------------------------------------------------------

# Rate-limit zones must live in the http{} block (/etc/nginx/nginx.conf):
#   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
#   limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vault.example.com;

    # ACME challenge + everything else to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vault.example.com;

    # --- TLS (managed by certbot) ------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/vault.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- security headers ---------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # API-only? then also: add_header Content-Security-Policy "default-src 'none'" always;

    root /var/www/crypto-vault/public;
    index index.php;

    charset utf-8;
    client_max_body_size 8m;

    # --- Laravel front controller ------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- block dotfiles (except ACME) --------------------------------------
    location ~ /\.(?!well-known).* { deny all; }

    # --- broadcasting auth + payment webhooks get tighter limits -----------
    location ^~ /api/v1/withdraw/request {
        limit_req zone=api burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /api/v1/auth {
        limit_req zone=login burst=3 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # --- PHP-FPM -------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # adjust PHP version
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # --- Reverb WebSocket proxy (wss://vault.example.com/app) --------------
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://127.0.0.1:8080;
    }

    location /apps {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8080;
    }
}
