; ---------------------------------------------------------------------------
; Crypto Vault — Laravel Horizon (queue workers)
; Copy to /etc/supervisor/conf.d/crypto-vault-horizon.conf
;
; Horizon supervises all queues: default, deposits, withdrawals
; (see config/horizon.php). Do NOT also run `queue:work` processes.
; ---------------------------------------------------------------------------
[program:crypto-vault-horizon]
process_name=%(program_name)s
command=php /var/www/crypto-vault/artisan horizon
directory=/var/www/crypto-vault
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/crypto-vault-horizon.log
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
